<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER JONAS · Mission CP</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#43baff,#1543a1 60%,#11194c);font-family:system-ui,sans-serif;color:white;min-height:100vh}button{cursor:pointer;font:inherit;font-weight:900;border:0}.wrap{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#071b64;border:2px solid #87dfff;border-radius:18px;padding:10px}.logo{text-align:center;padding:32px 0}.logo h1{font-size:clamp(3.5rem,11vw,7rem);line-height:.9;margin:10px;color:#ffcb2e;text-shadow:4px 5px #f43e2b,7px 9px #11236a;-webkit-text-stroke:2px white}.hero{font-size:100px}.start{background:linear-gradient(#a2ff55,#19b43c);border:3px solid white;border-radius:20px;color:#fff;padding:17px 32px;font-size:1.4rem;box-shadow:0 7px #08762e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.world{border:3px solid #bdeaff;border-radius:24px;min-height:175px;background:linear-gradient(145deg,var(--a),var(--b));color:white;box-shadow:0 8px #0b286e;display:grid;place-content:center;gap:9px;text-align:center;padding:12px}.world span{font-size:60px}.panel{background:#f6fbff;color:#132d69;border:5px solid #9de4ff;border-radius:28px;box-shadow:0 10px #09276c;max-width:730px;margin:25px auto;padding:25px;text-align:center}.question{font-size:clamp(1.5rem,5vw,2.7rem);font-weight:1000;margin:20px 0}.visual{font-size:clamp(2rem,6vw,3.4rem);line-height:1.7;overflow-wrap:anywhere}.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:13px;margin:25px 0}.choice{min-width:95px;min-height:80px;border:3px solid #abd8ff;border-radius:19px;background:linear-gradient(white,#d3eaff);color:#13449a;font-size:2rem;box-shadow:0 6px #82a9d8}.back{background:#1769d4;color:white;border:2px solid #9de7ff;border-radius:14px;padding:11px 17px}.voice{background:#ffdb57;color:#183366;border-radius:13px;padding:12px}.hidden{display:none}.bar{height:15px;border-radius:15px;background:#d6e8fc;overflow:hidden}.fill{height:100%;background:#ffc329;width:0}.ten{display:inline-block;width:28px;height:100px;background:repeating-linear-gradient(0deg,#0874dc 0 8px,#b6eaff 8px 10px);border:2px solid #0860b0;margin:5px;border-radius:4px}.unit{display:inline-block;width:30px;height:30px;background:#1698ed;border:2px solid #0860b0;margin:5px;border-radius:4px}.feedback{font-size:1.3rem;font-weight:900;min-height:36px}footer{text-align:center;padding:30px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.world{min-height:145px}.world span{font-size:43px}.panel{padding:14px}.choice{min-width:75px}.hero{font-size:70px}}
</style><style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap');
:root{--navy:#092660;--gold:#ffce29}
body{font-family:'Baloo 2',system-ui,sans-serif!important;background:radial-gradient(circle at 70% 25%,#9defff33,transparent 33%),linear-gradient(180deg,#0561c7 0%,#40baf3 42%,#c5f3ff 73%,#3079c5 100%)!important;background-attachment:fixed!important;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 14% 24%,#fff9 0 5%,transparent 6%),radial-gradient(ellipse at 79% 12%,#fff9 0 7%,transparent 8%),radial-gradient(ellipse at 90% 47%,#fff8 0 5%,transparent 6%),radial-gradient(ellipse at 27% 65%,#fff8 0 6%,transparent 7%);opacity:.65}
.wrap{position:relative;max-width:1170px!important}.pill{border:3px solid #b8f4ff!important;box-shadow:0 5px 0 #0a2e79,0 10px 20px #06286a55;font-size:1.1rem}.logo{position:relative;min-height:680px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 0 45px!important;isolation:isolate}.logo:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(0deg,#06418e66,transparent 45%),url('assets/hero-world.svg') center/cover no-repeat;border-radius:34px;border:4px solid #b6edff;box-shadow:0 18px 0 #073374,0 25px 50px #072b6a66}.logo:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,#0b388355,transparent 60%);border-radius:34px}.logo .hero{font-size:0!important;width:min(42vw,340px);height:320px;background:url('assets/super-jonas.svg') center/contain no-repeat;filter:drop-shadow(0 16px 10px #0b2d6b88);animation:fly 3s ease-in-out infinite}.logo h1{font-family:'Baloo 2',system-ui!important;font-size:clamp(4rem,12vw,8.5rem)!important;line-height:.82!important;letter-spacing:-4px;color:#ffdf36!important;text-shadow:0 5px #ff7c19,0 11px #e83428,4px 16px #092a79!important;-webkit-text-stroke:3px #fff!important;filter:drop-shadow(0 6px #092b78);transform:rotate(-3deg)}.logo h2{display:inline-block;padding:7px 22px;background:#07317d;border:3px solid #d5f8ff;border-radius:30px;transform:rotate(-3deg);box-shadow:0 6px #061d5a}.logo p{background:#082a6bc4;border-radius:20px;padding:6px 20px;font-size:1.2rem;font-weight:800}.start{background:linear-gradient(#ffe967,#ffb200)!important;color:#092e7a!important;text-shadow:none!important;border:4px solid white!important;box-shadow:0 8px #ba6206,0 12px 20px #05275e66!important;transition:transform .2s}.start:hover,.world:hover,.choice:hover{transform:translateY(-5px) scale(1.02)}.world{min-height:270px!important;position:relative;overflow:hidden;border:4px solid #f4fdff!important;box-shadow:0 9px #0a327b,0 17px 24px #08285b66!important;justify-items:center;align-content:end!important;padding-bottom:25px!important;transition:transform .2s;background:linear-gradient(180deg,#1f86dc11,#072d7da8),url('assets/worlds.svg') var(--pos) center/600% 100% no-repeat!important}.world:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#071b70d9,transparent 65%);pointer-events:none}.world span{font-size:65px!important;filter:drop-shadow(0 4px 3px #082461);z-index:1}.world strong{position:relative;z-index:1;font-size:1.25rem;line-height:1.1;text-shadow:0 3px #071c60}.world small{position:relative;z-index:1;background:#092d78;border:2px solid #8fe9ff;padding:4px 20px;border-radius:20px;font-size:1rem}.panel{background:linear-gradient(#ffffff,#e6f4ff)!important;border:6px solid #fff!important;outline:4px solid #0b70cf;box-shadow:0 12px #073781,0 24px 35px #052b6666!important}.panel h2{color:#0a3b8c}.question{color:#102f7e}.visual{min-height:95px}.choice{transition:transform .15s;background:linear-gradient(#fff,#d4eaff)!important;border:4px solid #fff!important;outline:2px solid #9ecfff;box-shadow:0 7px #6499ce!important}.back{box-shadow:0 4px #06276e}.voice{box-shadow:0 4px #c18c19}.feedback{color:#177b42}.grid{gap:24px!important}#game{padding-top:30px}#game .panel{position:relative}#game .panel:before{content:"";position:absolute;right:-32px;top:-65px;width:125px;height:150px;background:url('assets/super-jonas.svg') center/contain no-repeat;filter:drop-shadow(0 5px 5px #073a7188);pointer-events:none}#worlds>h1{text-shadow:0 4px #064188;font-size:clamp(2rem,5vw,3.7rem)}@keyframes fly{50%{transform:translateY(-18px) rotate(3deg)}}@media(max-width:650px){.logo{min-height:610px}.logo .hero{width:210px;height:220px}.logo h1{letter-spacing:-2px}.world{min-height:200px!important}.world span{font-size:46px!important}.world strong{font-size:1rem}.grid{gap:14px!important}#game .panel:before{width:80px;height:90px;right:0;top:-50px}}
</style></head><body><main class="wrap"><header><div class="pill">⭐ <b id="stars">0</b> étoiles</div><div class="pill">🦸 JONAS · Niv. <b id="level">1</b></div><button class="back" onclick="toggleVoice()" id="voiceToggle">🔊 Voix</button></header><section id="home"><div class="logo"><div class="hero">🦸🏻‍♂️</div><h1>SUPER<br>JONAS</h1><h2>⚡ LA MISSION CP ⚡</h2><p>Deviens le super-héros des nombres et des lettres !</p><button class="start" onclick="showWorlds()">🚀 C'EST PARTI !</button></div><div class="panel"><div style="font-size:55px">🤖</div><h2>Salut Jonas ! Je suis Robo !</h2><button class="voice" onclick="speak('Salut Jonas ! Je suis Robo. Prêt pour ta mission ?')">🔊 Écoute-moi</button></div></section><section id="worlds" class="hidden"><h1 style="text-align:center">🌍 LES MONDES DE JONAS</h1><div id="grid" class="grid"></div><button class="back" onclick="show('home')">🏠 Accueil</button></section><section id="game" class="hidden"><button class="back" onclick="showWorlds()">⬅️ Mondes</button><div class="panel"><div style="font-size:50px" id="icon"></div><h2 id="title"></h2><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="visual" id="visual"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="voice" onclick="speak(instruction)">🔊 Réécouter</button></div></section><footer>💙 Super Jonas · Progression sauvegardée sur cet appareil</footer></main><script>
const worlds=[['Royaume des nombres','🔢','#39bdff','#1c4fc0'],['Planète des dizaines','🧊','#ffcd45','#dd7a17'],['Cité des additions','➕','#ff85bc','#9334bd'],['Forêt des sons','🔤','#4bdc9b','#087f77'],['Île des mots','📖','#7bc8ff','#4954c0'],['Tour des défis','🏆','#b69bff','#5b2aa0']];
let stars=+(localStorage.getItem('superJonasStars')||0),voice=localStorage.getItem('superJonasVoice')!=='off',world=0,round=0,locked=false,instruction='',current;
const el=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function update(){el('stars').textContent=stars;el('level').textContent=1+Math.floor(stars/20);el('voiceToggle').textContent=voice?'🔊 Voix':'🔇 Muet'}
function speak(t){instruction=t;if(!voice||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.83;u.pitch=1.1;speechSynthesis.speak(u)}
function toggleVoice(){voice=!voice;localStorage.setItem('superJonasVoice',voice?'on':'off');update();if(voice)speak('Bravo Jonas, la voix fonctionne !')}
function show(id){['home','worlds','game'].forEach(x=>el(x).classList.toggle('hidden',x!==id))}
function showWorlds(){show('worlds');speak('Choisis ton monde, Jonas !')}
el('grid').innerHTML=worlds.map((w,i)=>'<button class="world" style="--a:'+w[2]+';--b:'+w[3]+';--pos:'+(i*20)+'%" onclick="start('+i+')"><span>'+w[1]+'</span><strong>'+w[0]+'</strong><small>⭐ Jouer</small></button>').join('');
function start(i){world=i;round=0;el('title').textContent=worlds[i][0];el('icon').textContent=worlds[i][1];show('game');next()}
function task(){let m=world===5?rnd(5):world,a,display='',visual='',say='',opts=[];
if(m===0){a=1+rnd(10);visual=Array(a).fill(['🚀','🍎','⭐','⚽'][rnd(4)]).join(' ');display='Combien y en a-t-il ?';say='Compte les images et choisis le bon nombre.';opts=[a,a+1,Math.max(0,a-1)]}
if(m===1){let d=1+rnd(3),u=rnd(10);a=d*10+u;visual='<div>'+Array(d).fill('<span class="ten"></span>').join('')+'</div><div>'+Array(u).fill('<span class="unit"></span>').join('')+'</div>';display='Dizaines + unités = ?';say='Il y a '+d+' dizaines et '+u+' unités. Quel nombre cela fait ?';opts=[a,a+10,a===d*10?a+1:a-1]}
if(m===2){let x=1+rnd(8),y=1+rnd(7);a=x+y;display=x+' + '+y+' = ?';visual='⭐'.repeat(x)+'<br>'+'🌟'.repeat(y);say='Combien font '+x+' plus '+y+' ?';opts=[a,a+1,a-1]}
if(m===3){let arr=[['M','moto','🏍️'],['S','soleil','☀️'],['L','lion','🦁'],['B','banane','🍌'],['R','robot','🤖'],['F','fusée','🚀'],['P','pomme','🍎']];let x=arr[rnd(arr.length)];a=x[0];display='Quelle est la première lettre ?';visual=x[2];say='Écoute le mot : '+x[1]+'. Quelle lettre entends-tu au début ?';opts=[a,...shuffle(arr.filter(z=>z[0]!==a)).slice(0,2).map(z=>z[0])]}
if(m===4){let arr=[['MA','maman','👩'],['PA','papa','👨'],['LA','lapin','🐰'],['RA','radis','🌱'],['MO','moto','🏍️'],['SO','soleil','☀️']];let x=arr[rnd(arr.length)];a=x[0];display='Quelle est la première syllabe ?';visual=x[2];say='Écoute : '+x[1]+'. Quelle est la première syllabe ?';opts=[a,...shuffle(arr.filter(z=>z[0]!==a)).slice(0,2).map(z=>z[0])]}
return{a,display,visual,say,opts:shuffle([...new Set(opts)])}}
function next(){locked=false;current=task();el('fill').style.width=(round%10)*10+'%';el('question').textContent=current.display;el('visual').innerHTML=current.visual;el('feedback').textContent='';el('choices').innerHTML=current.opts.map((x,i)=>'<button class="choice" onclick="choose('+i+')">'+x+'</button>').join('');speak(current.say)}
function choose(i){if(locked)return;if(current.opts[i]===current.a){locked=true;stars++;localStorage.setItem('superJonasStars',stars);update();round++;el('feedback').textContent='🌟 BRAVO SUPER JONAS !';speak('Bravo Jonas ! Une étoile de plus !');setTimeout(()=>{if(round%10===0){el('question').textContent='🏆 MISSION RÉUSSIE !';el('visual').textContent='🦸🏻‍♂️ ⭐⭐⭐';el('choices').innerHTML='<button class="start" onclick="next()">🚀 CONTINUER</button>';el('feedback').textContent='10 défis accomplis !';speak('Super Jonas ! Tu as réussi dix défis !')}else next()},1500)}else{el('feedback').textContent='💙 Essaie encore !';speak('Essaie encore, super héros !')}}
update();
</script></body></html>
