:1.35rem}.robot{font-size:3rem}.progress{height:15px;border-radius:20px;background:#c4dcf4;overflow:hidden;max-width:500px;margin:12px auto}.progress>div{height:100%;background:linear-gradient(90deg,#1fc888,#ffdb3b);transition:width .3s}.palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}.swatch{border:4px solid white;border-radius:50%;width:58px;height:58px;box-shadow:0 4px #8baed5}.swatch.selected{outline:5px solid #ffb400;transform:scale(1.1)}.art{display:block;width:min(100%,500px);max-height:390px;margin:12px auto;background:#fff;border-radius:22px;border:4px solid #a7d5f7}.art [data-part]{cursor:pointer;stroke:#173a70;stroke-width:5;transition:fill .2s}.instruction{background:#fff8d9;border:3px solid #ffcf54;border-radius:20px;padding:12px;text-align:center;font-size:1.3rem;font-weight:800}.tiny{font-size:.95rem;color:#4b6894;text-align:center}.badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.badge{background:#fff2b9;color:#8e5200;border-radius:15px;padding:6px 12px;font-weight:800}.locked{opacity:.55}@keyframes bob{50%{transform:translateY(-15px)}}@media(max-width:700px){.app{padding:10px}.worlds{grid-template-columns:repeat(2,1fr);gap:12px}.world{min-height:170px}.world .symbol{font-size:2.6rem}.world strong{font-size:1rem}.hero{min-height:490px}.hero:before{top:2%;left:27%;width:46%;height:40%}.hero h1{margin-top:170px}.stage{padding:15px}.swatch{width:47px;height:47px}.top{justify-content:center}}

const saved=JSON.parse(localStorage.getItem('superjonas-v3')||'{}');let state={stars:saved.stars||0,lesson:saved.lesson||0,done:saved.done||{},voice:saved.voice!==false};let mode='',round=0,current=null,colorStep=0,colorSelected='',readStep=0,feedback='',answered=false;

function save(){localStorage.setItem('superjonas-v3',JSON.stringify(state));document.getElementById('stars').textContent='⭐ '+state.stars+' étoiles';document.getElementById('level').textContent=1+Math.floor(state.stars/20);document.getElementById('voice').textContent=state.voice?'🔊 Voix ON':'🔇 Voix OFF'}

function toggleVoice(){state.voice=!state.voice;save();if(state.voice)say('Salut Jonas ! Prêt pour une aventure ?')}
function el(s){document.getElementById('view').innerHTML=s}
function nav(){return '<div class="nav"><button class="action secondary" onclick="home()">🏠 Accueil</button><button class="action secondary" onclick="map()">🗺️ Les mondes</button></div>'}
function home(){mode='home';el('<section class="hero"><h1>SUPER<br>JONAS</h1><p>⚡ LA MISSION CP ⚡</p><p>Deviens le héros des lettres et des nombres !</p><button class="cta" onclick="map()">🚀 C’EST PARTI !</button></section><p class="sub">🎨 Colorie · 📖 Apprends à lire · ⭐ Gagne des étoiles</p>');}
function map(){mode='map';el('<h1 class="title">🌍 LES MONDES DE JONAS</h1><p class="sub">Choisis ton aventure, super-héros !</p><section class="worlds">'+worlds.map((w,i)=>'<button class="world" style="--pos:'+((i%6)*20)+'%" onclick="start(\''+w[2]+'\')"><span class="symbol">'+w[0]+'</span><strong>'+w[1]+'</strong><small>⭐ Jouer</small></button>').join('')+'</section>'+nav());}

function start(m){mode=m;round=0;feedback='';answered=false;if(m==='color'){colorStep=0;colorSelected='';renderColor()}else if(m==='read'){readStep=0;renderRead()}else if(m==='story'){renderStory()}else{question()}}
function rand(n){return Math.floor(Math.random()*n)}
function mix(a){return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function options(vals,correct){return '<div class="choices">'+mix([...new Set(vals)]).map(x=>'<button class="option" onclick="answer(\''+String(x).replace(/'/g,"\\'")+'\')">'+x+'</button>').join('')+'</div>'}
function question(){answered=false;feedback='';let title='',prompt='',visual='',answer='',opts=[];let a=1+rand(7),b=1+rand(5);if(mode==='numbers'||mode==='challenge'&&round%3===0){title='🔢 Le royaume des nombres';answer=a;visual='<div class="big">'+Array.from({length:a},()=>['🚀','🍎','⭐','🐸'][round%4]).join(' ')+'</div>';prompt='Compte les objets. Combien y en a-t-il ?';opts=[a,Math.max(1,a-1),a+1]}else if(mode==='tens'||mode==='challenge'&&round%3===1){title='🧊 La planète des dizaines';a=1+rand(4);b=rand(10);answer=a*10+b;visual='<div class="big">'+a+' 🟦<span> dizaines</span><br>'+b+' 🔹<span> unités</span></div>';prompt='Combien font '+a+' dizaines et '+b+' unités ?';opts=[answer,answer+10,answer+1]}else if(mode==='add'||mode==='challenge'){title='➕ La cité des additions';answer=a+b;visual='<div class="big">'+a+' <span>+</span> '+b+' = ?</div>';prompt='Compte et trouve le résultat !';opts=[answer,answer+1,Math.max(1,answer-1)]}else if(mode==='train'){title='🚂 Le train des syllabes';let l=lessons[Math.min(state.lesson,lessons.length-1)];answer=l.sy;visual='<div class="big">🚂 '+l.a+' + '+l.b+' = ?</div>';prompt='Écoute les deux sons. Quelle syllabe forment-ils ?';opts=[l.sy,l.a+'O','LI']}else{title='Mission';answer=1;opts=[1,2,3]}current={answer:String(answer),prompt};shell(title,'<p class="hint">Mission '+(round+1)+' / 5</p><div class="progress"><div style="width:'+(round*20)+'%"></div></div><div class="lesson">'+visual+'</div><p class="instruction">🤖 '+prompt+'</p><div id="answers">'+options(opts,answer)+'</div><div class="feedback" id="feedback"></div><div class="nav"><button class="action" onclick="say(current.prompt)">🔊 Réécouter</button></div>');setTimeout(()=>say(prompt),150)}
function answer(v){if(answered)return;let f=document.getElementById('feedback');if(v===current.answer){answered=true;earn();f.textContent='🌟 Bravo Super Jonas !';say('Bravo Jonas ! Tu as réussi !');document.getElementById('answers').innerHTML='<div class="nav"><button class="cta" onclick="nextQuestion()">➡️ Continuer</button></div>'}else{f.textContent='💙 Essaie encore, tu vas y arriver !';say('Presque ! Réessaie tranquillement.')}}
function nextQuestion(){round++;if(round>=5){shell('🏆 Mission accomplie !','<div class="lesson"><div class="big">⭐⭐⭐⭐⭐</div><p class="hint">Tu as terminé les cinq défis !</p></div><div class="nav"><button class="cta" onclick="start(mode)">🔁 Rejouer</button></div>')}else question()}
function lesson(){return lessons[Math.min(state.lesson,lessons.length-1)]}
function renderRead(){let l=lesson(),steps=[{title:'Découvre les sons',big:'<span>'+l.a+'</span> · '+l.b,txt:'Écoute les sons, puis répète avec le robot.',voice:'Le '+l.a+' fait '+l.a.toLowerCase()+' et le '+l.b+' fait '+l.b.toLowerCase()+'. '+l.prompt},{title:'La magie des lettres',big:l.a+' <span>+</span> '+l.b+' <span>=</span> '+l.sy,txt:'Regarde : les deux sons se collent pour former une syllabe.',voice:l.prompt},{title:'À toi de lire !',big:l.sy,txt:'Essaie de lire cette syllabe tout seul, puis écoute.',voice:'Essaie de lire. '+l.sy+'. Bravo !'}],s=steps[readStep];shell('📖 Académie de lecture','<p class="hint">Leçon '+(state.lesson+1)+' / '+lessons.length+' · '+s.title+'</p><div class="progress"><div style="width:'+((readStep+1)*33)+'%"></div></div><div class="lesson"><div class="robot">🤖</div><div class="big">'+s.big+'</div><p class="hint">'+s.txt+'</p></div><div class="nav"><button class="action" onclick="say('+JSON.stringify(s.voice).replace(/"/g,'&quot;')+')">🔊 Écouter le robot</button><button class="cta" onclick="nextRead()">'+(readStep===2?'🎯 Je m’entraîne':'➡️ Suivant')+'</button></div>');setTimeout(()=>say(s.voice),200)}
function nextRead(){if(readStep<2){readStep++;renderRead()}else readQuiz()}
function readQuiz(){let l=lesson();current={answer:l.sy,prompt:'Écoute et trouve la syllabe '+l.sy};answered=false;shell('🎯 Le défi du super-lecteur','<p class="instruction">🤖 Écoute la syllabe, puis touche la bonne réponse.</p><div class="nav"><button class="action" onclick="say(current.prompt)">🔊 Écouter la syllabe</button></div><div id="answers">'+options([l.sy,l.a+'O',l.a+'I',l.b+'M'],l.sy)+'</div><div class="feedback" id="feedback"></div>');setTimeout(()=>say(current.prompt),250)}
const oldAnswer=answer;answer=function(v){if(mode==='read'){if(answered)return;let f=document.getElementById('feedback');if(v===current.answer){answered=true;earn(3);f.textContent='🌟 Incroyable ! Tu sais lire '+v+' !';say('Bravo Jonas ! Tu sais lire '+v+' !');document.getElementById('answers').innerHTML='<div class="nav"><button class="cta" onclick="advanceRead()">⭐ Leçon suivante</button><button class="action secondary" onclick="renderRead()">🔁 Revoir la leçon</button></div>'}else{f.textContent='Écoute encore les sons, tu peux y arriver !';say('Écoute encore, puis réessaie !')}}else oldAnswer(v)}

function artSvg(){let d=drawings[Math.floor(colorStep/5)%2],shape=d.name==='la fusée'?'<path data-part="corps" d="M190 250 L190 120 Q250 20 310 120 L310 250 Z"/><circle data-part="fenêtre" cx="250" cy="153" r="33"/><path data-part="aile gauche" d="M190 210 L130 280 L190 280 Z"/><path data-part="aile droite" d="M310 210 L370 280 L310 280 Z"/><path data-part="flamme" d="M215 255 Q225 340 250 360 Q275 340 285 255 Z"/>':'<rect data-part="mur" x="140" y="155" width="220" height="190"/><path data-part="toit" d="M105 160 L250 55 L395 160 Z"/><rect data-part="porte" x="225" y="245" width="55" height="100"/><circle data-part="soleil" cx="425" cy="65" r="38"/><path data-part="arbre" d="M70 345 L70 270 Q10 265 45 210 Q70 150 105 210 Q145 265 90 270 L90 345 Z"/>';return '<svg class="art" viewBox="0 0 500 390" role="img" aria-label="Dessin à colorier : '+d.name+'"><rect width="500" height="390" fill="#e6f8ff"/><path d="M0 350 Q250 325 500 350 L500 390 L0 390" fill="#b4e8b4"/>'+shape.replace(/data-part="([^"]+)"/g,(all,p)=>'data-part="'+p+'" fill="'+(colored[p]||'#fff')+'" onclick="paint(\''+p+'\')"')+'</svg>'}
let colored={};

/* Accessibility and navigation update: large persistent controls and voice recovery */
let lastInstruction='Salut Jonas ! Choisis un monde pour commencer.';
let voiceReady=false;
function pickFrenchVoice(){
  if(!('speechSynthesis' in window))return null;
  const vs=window.speechSynthesis.getVoices();
  return vs.find(v=>/^fr[-_](FR|CA)/i.test(v.lang)&&/premium|enhanced|amelie|thomas|audrey|hortense/i.test(v.name))
    ||vs.find(v=>/^fr[-_]FR/i.test(v.lang))
    ||vs.find(v=>/^fr/i.test(v.lang))||null;
}
say=function(t){
  lastInstruction=String(t||'');
  if(!state.voice||!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    const utter=new SpeechSynthesisUtterance(lastInstruction);
    utter.lang='fr-FR';utter.rate=.76;utter.pitch=1.06;utter.volume=1;
    const v=pickFrenchVoice();if(v)utter.voice=v;
    utter.onerror=function(e){if(e.error!=='interrupted'&&e.error!=='canceled'){const b=document.getElementById('listen-fixed');if(b)b.textContent='🔊 Appuie pour écouter';}};
    window.speechSynthesis.speak(utter);
  }catch(e){const b=document.getElementById('listen-fixed');if(b)b.textContent='🔊 Appuie pour écouter';}
};
function replayVoice(){if(!state.voice){state.voice=true;save()}say(lastInstruction||'Salut Jonas !')}
toggleVoice=function(){
  state.voice=!state.voice;save();
  if(state.voice)say('Coucou Jonas ! Je suis ton robot. On joue ensemble !');
  else if('speechSynthesis' in window)window.speechSynthesis.cancel();
};
function goBack(){
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  if(mode==='home'){map();return}
  if(mode==='map'){home();return}
  if(mode==='read'){
    if(readStep>0){readStep--;renderRead();return}
    map();return;
  }
  if(mode==='color'){
    if(colorStep>0){colorStep--;renderColor();return}
    map();return;
  }
  if(mode==='story'){map();return}
  if(round>0){round--;question();return}
  map();
}
nav=function(){
  return '<div class="nav" aria-label="Navigation"><button class="action secondary" onclick="goBack()">⬅️ Retour</button><button class="action secondary" onclick="map()">🗺️ Mondes</button><button class="action secondary" onclick="home()">🏠 Accueil</button></div>';
};
const oldHome=home,oldMap=map,oldShell=shell,oldStart=start;
home=function(){oldHome();lastInstruction='Bienvenue Super Jonas ! Appuie sur c’est parti pour découvrir les mondes.';addNavBar()};
map=function(){oldMap();lastInstruction='Choisis un monde pour commencer ton aventure !';addNavBar()};
shell=function(title,body){oldShell(title,body);addNavBar()};
function addNavBar(){
  document.getElementById('child-controls')?.remove();
  const bar=document.createElement('div');
  bar.id='child-controls';bar.className='child-controls';
  bar.innerHTML='<button class="kid-back" onclick="goBack()">⬅️ RETOUR</button><button class="kid-listen" id="listen-fixed" onclick="replayVoice()">🔊 ÉCOUTER</button><button class="kid-home" onclick="map()">🗺️ MONDES</button>';
  document.querySelector('.top').insertAdjacentElement('afterend',bar);
}
start=function(m){
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  oldStart(m);
  if(m==='read')lastInstruction='Bienvenue à l’académie de lecture ! Écoute le robot et découvre les sons.';
  if(m==='color')lastInstruction='Bienvenue dans l’atelier des couleurs ! Choisis une couleur, puis touche le dessin.';
};
document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'){e.preventDefault();goBack()}});
if('speechSynthesis' in window){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=function(){pickFrenchVoice()}}
addNavBar();


const pedagogic=[
['Bonjour Jonas ! Aujourd’hui, nous allons faire de la magie avec les sons. Ferme les lèvres : mmmm. Maintenant, ouvre la bouche : aaaa. Très bien !','Écoute bien : mmmm… aaaa… mmmmaaaa. Tu entends ? Ça fait MA ! À toi de répéter.','Regarde : M et A. Ensemble, ça fait MA. Essaie de lire tout seul avant moi. Bravo !'],
['Écoute ce son : llll. Et maintenant : aaaa.','On les rapproche doucement : llllaaaa. Ça fait LA ! À toi !','L et A font LA. Tu viens de lire une nouvelle syllabe !'],
['On connaît déjà mmmm. Voici iiiii.','On rapproche : mmmm… iiii… MI !','M et I font MI. Essaie tout seul !'],
['Écoute : llll… iiiii.','Ensemble : lllliiii. LI !','L et I font LI. Bravo Jonas !'],
['Écoute le serpent : sssss. Et maintenant aaaa.','Ensemble : ssssaaaa. SA !','S et A font SA. À toi !'],
['Écoute : rrrr… aaaa.','Ensemble : rrrraaaa. RA !','R et A font RA. Super !'],
['Écoute : mmmm… oooo.','Ensemble : mmmmoooo. MO !','M et O font MO. Tu progresses !'],
['Écoute : p… aaaa.','Ensemble : p… aaaa. PA !','P et A font PA. Bravo champion !']
];
let voiceRole='teacher';
function speakLesson(){
  voiceRole='teacher';
  const text=pedagogic[Math.min(state.lesson,7)][readStep];
  say(text);
}
const previousRenderRead=renderRead;
renderRead=function(){
  previousRenderRead();
  const b=document.querySelector('.stage .nav .action');
  if(b){b.setAttribute('onclick','speakLesson()');b.textContent='👩‍🏫 Écouter la maîtresse'}
  const intro=document.querySelector('.stage .lesson');
  if(intro)intro.insertAdjacentHTML('afterend','<p class="tiny">👂 Écoute, répète, puis avance quand tu es prêt.</p>');
  speakLesson();
};
const previousReplayVoice=replayVoice;
replayVoice=function(){
  if(mode==='read'&&document.querySelector('.stage .lesson')){speakLesson();return}
  previousReplayVoice();
};
const previousSay=say;
say=function(t){
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  lastInstruction=String(t||'');
  if(!state.voice||!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(lastInstruction);
  u.lang='fr-FR';u.rate=voiceRole==='teacher'?.78:.9;u.pitch=voiceRole==='teacher'?1:1.13;
  const voices=window.speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));
  const chosen=voices.find(v=>/amelie|audrey|hortense|marie|female/i.test(v.name))||voices[0];
  if(chosen)u.voice=chosen;
  window.speechSynthesis.speak(u);
};


/* Temporarily mute synthetic lesson speech: phonics needs verified human audio. */
const lessonSyntheticSpeechDisabled=true;
const _lessonSay=say;
say=function(t){
  lastInstruction=String(t||'');
  if(mode==='read'||mode==='story'||mode==='train'){
    if('speechSynthesis' in window)window.speechSynthesis.cancel();
    return;
  }
  _lessonSay(t);
};
const _lessonReplay=replayVoice;
replayVoice=function(){
  if(mode==='read'||mode==='story'||mode==='train'){
    if('speechSynthesis' in window)window.speechSynthesis.cancel();
    const b=document.getElementById('listen-fixed');
    if(b)b.textContent='📖 Lis avec un adulte';
    return;
  }
  _lessonReplay();
};
const _lessonRender=renderRead;
renderRead=function(){
  _lessonRender();
  const b=document.querySelector('[onclick="speakLesson()"]');
  if(b){b.disabled=true;b.textContent='🎧 Audio en préparation';b.title='La voix synthétique a été retirée des leçons.';}
  const f=document.getElementById('listen-fixed');
  if(f)f.textContent='📖 Lecture';
};


/* Distinct exercises: a prebuilt, shuffled set of ten questions per mission. */
let exerciseDeck=[];
function shuffled(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildExercises(m){
 const items=[];
 const add=(kind,a,b)=>items.push({kind,a,b,key:kind+':'+a+':'+b});
 if(m==='numbers'||m==='challenge'){for(let a=1;a<=9;a++)add('numbers',a,0)}
 if(m==='tens'||m==='challenge'){for(let a=1;a<=4;a++)for(let b=0;b<=9;b++)add('tens',a,b)}
 if(m==='add'||m==='challenge'){for(let a=1;a<=9;a++)for(let b=1;b<=9;b++)if(a+b<=15)add('add',a,b)}
 if(m==='train'){const syl=['MA','LA','MI','LI','SA','RA','MO','PA','SO','LO','SI','RO','PO','RI'];for(let i=0;i<syl.length;i++)add('train',i,0)}
 if(m==='numbers'){for(let a=10;a<=12;a++)add('numbers',a,0)}
 return shuffled(items).slice(0,10);
}
const originalStart=start;
start=function(m){exerciseDeck=buildExercises(m);originalStart(m)};
question=function(){
 answered=false;feedback='';
 if(!exerciseDeck.length)exerciseDeck=buildExercises(mode);
 const q=exerciseDeck[Math.min(round,exerciseDeck.length-1)];
 let title='',prompt='',visual='',correct='',opts=[];
 if(q.kind==='numbers'){
 title='🔢 Le royaume des nombres';correct=q.a;
 const icon=['🚀','🍎','⭐','🐸','🦋','🍓','🌸','🐱','🌞','⚽'][round%10];
 visual='<div class="big">'+Array(q.a).fill(icon).join(' ')+'</div>';
 prompt='Compte les objets. Combien y en a-t-il ?';
 opts=[correct,correct+1,correct===1?3:correct-1];
 }else if(q.kind==='tens'){
 title='🧊 La planète des dizaines';correct=q.a*10+q.b;
 visual='<div class="big">'+q.a+' 🟦<span> dizaines</span><br>'+q.b+' 🔹<span> unités</span></div>';
 prompt='Combien font '+q.a+' dizaines et '+q.b+' unités ?';
 opts=[correct,correct+10,correct+1];
 }else if(q.kind==='add'){
 title='➕ La cité des additions';correct=q.a+q.b;
 visual='<div class="big">'+q.a+' <span>+</span> '+q.b+' = ?</div>';
 prompt='Compte et trouve le résultat !';
 opts=[correct,correct+1,correct-1];
 }else{
 const syl=['MA','LA','MI','LI','SA','RA','MO','PA','SO','LO','SI','RO','PO','RI'];
 correct=syl[q.a];title='🚂 Le train des syllabes';
 visual='<div class="big">🚂 '+correct[0]+' + '+correct[1]+' = ?</div>';
 prompt='Regarde les lettres. Quelle syllabe forment-elles ?';
 opts=[correct,syl[(q.a+3)%syl.length],syl[(q.a+7)%syl.length]];
 }
 current={answer:String(correct),prompt};
 const total=exerciseDeck.length;
 shell(title,'<p class="hint">Mission '+(round+1)+' / '+total+'</p><div class="progress"><div style="width:'+(round/total*100)+'%"></div></div><div class="lesson">'+visual+'</div><p class="instruction">'+prompt+'</p><div id="answers">'+options(opts,correct)+'</div><div class="feedback" id="feedback"></div><div class="nav"><button class="action" onclick="say(current.prompt)">🔊 Réécouter</button></div>');
 setTimeout(()=>say(prompt),150);
};
nextQuestion=function(){
 round++;
 if(round>=exerciseDeck.length){
 shell('🏆 Mission accomplie !','<div class="lesson"><div class="big">⭐⭐⭐⭐⭐</div><p class="hint">Tu as terminé les '+exerciseDeck.length+' défis différents !</p></div><div class="nav"><button class="cta" onclick="start(mode)">🔁 Nouvelle série</button></div>');
 }else question();
};


/* Count the pictures: three progressive levels, ten distinct questions. */
const countLevels=[
 {label:'🌱 Niveau 1',detail:'1 à 5 images',min:1,max:5},
 {label:'🌟 Niveau 2',detail:'6 à 10 images',min:6,max:10},
 {label:'🚀 Niveau 3',detail:'11 à 20 images',min:11,max:20}
];
const pictureSet=['🍎','🐶','🦋','⭐','🚗','🐸','🍓','🐠','🌸','🎈','🐱','🍌','⚽','🐝','🍉','🐧','🍒','🚀','🦄','🌞'];
const wordSet=[
 {icon:'🐱',word:'CHAT',other:['CHIEN','LUNE']},
 {icon:'🐶',word:'CHIEN',other:['CHAT','LIVRE']},
 {icon:'🌞',word:'SOLEIL',other:['LUNE','BALLON']},
 {icon:'🌙',word:'LUNE',other:['SOLEIL','POMME']},
 {icon:'🍎',word:'POMME',other:['POIRE','MAISON']},
 {icon:'🍌',word:'BANANE',other:['POMME','LIVRE']},
 {icon:'🏠',word:'MAISON',other:['MOTO','CHIEN']},
 {icon:'🚗',word:'VOITURE',other:['BATEAU','VÉLO']},
 {icon:'🚲',word:'VÉLO',other:['MOTO','BATEAU']},
 {icon:'🦋',word:'PAPILLON',other:['LAPIN','BALLON']},
 {icon:'🐰',word:'LAPIN',other:['PAPILLON','CHAT']},
 {icon:'🎈',word:'BALLON',other:['PAPILLON','SOLEIL']},
 {icon:'📚',word:'LIVRE',other:['MAISON','POMME']},
 {icon:'🐟',word:'POISSON',other:['OISEAU','CHIEN']},
 {icon:'🐦',word:'OISEAU',other:['POISSON','LAPIN']},
 {icon:'🚢',word:'BATEAU',other:['VÉLO','VOITURE']}
];
let countLevel=0,activeDeck=[],wordLevel=0,oralRecognition=null;
function showCountLevels(){
 mode='countlevels';
 shell('🧮 Combien d’images ?','<p class="instruction">Choisis ton niveau, Jonas !</p><div class="level-picks">'+countLevels.map((l,i)=>'<button onclick="beginCount('+i+')">'+l.label+'<br><small>'+l.detail+'</small></button>').join('')+'</div>');
}
function beginCount(level){
 countLevel=level;mode='counting';round=0;
 const cfg=countLevels[level];
 const quantities=shuffled(Array.from({length:cfg.max-cfg.min+1},(_,i)=>i+cfg.min));
 activeDeck=Array.from({length:10},(_,i)=>({qty:quantities[i%quantities.length],icon:pictureSet[(i+level*6+Math.floor(Math.random()*5))%pictureSet.length]}));
 renderCount();
}
function renderCount(){
 const q=activeDeck[round];answered=false;
 const n=q.qty;
 const candidates=shuffled([n,n+1,n>1?n-1:n+2,n+2]).filter((v,i,a)=>v>0&&a.indexOf(v)===i).slice(0,3);
 current={answer:String(n),prompt:'Compte les images. Combien y en a-t-il ?'};
 shell('🧮 '+countLevels[countLevel].label,'<p class="hint">Question '+(round+1)+' / 10</p><div class="progress"><div style="width:'+(round*10)+'%"></div></div><p class="instruction">Combien y en a-t-il ?</p><div class="count-pictures">'+Array(n).fill('<span>'+q.icon+'</span>').join('')+'</div><div id="answers">'+options(candidates,n)+'</div><div class="feedback" id="feedback"></div>');
}
function beginWords(){
 mode='words';round=0;activeDeck=shuffled(wordSet).slice(0,10);renderWords();
}
function renderWords(){
 answered=false;
 const q=activeDeck[round];
 current={answer:q.word,prompt:'Regarde l’image. Quel est ce mot ?'};
 shell('🗣️ Les mots en images','<p class="hint">Image '+(round+1)+' / 10</p><div class="progress"><div style="width:'+(round*10)+'%"></div></div><div class="word-picture">'+q.icon+'</div><p class="oral">👄 Dis le nom de l’image à voix haute !</p><p class="instruction">Puis touche le bon mot.</p><div id="answers">'+options([q.word,...q.other],q.word)+'</div><div class="feedback" id="feedback"></div>');
}
const prevAnswerForGames=answer;
answer=function(v){
 if(mode!=='counting'&&mode!=='words')return prevAnswerForGames(v);
 if(answered)return;
 const f=document.getElementById('feedback');
 if(String(v)===current.answer){
  answered=true;earn();
  f.textContent=mode==='counting'?'🌟 Bravo ! Tu as bien compté !':'🌟 Bravo ! Tu as trouvé le mot !';
  document.getElementById('answers').innerHTML='<div class="nav"><button class="cta" onclick="nextPicture()">➡️ Suivant</button></div>';
 }else f.textContent='💙 Essaie encore, tu peux y arriver !';
};
function nextPicture(){
 round++;
 if(round>=10){
  shell('🏆 Super champion !','<div class="lesson"><div class="big">🌟🏅🌟</div><p class="hint">Tu as réussi tes 10 images !</p></div><div class="nav"><button class="cta" onclick="'+(mode==='counting'?'showCountLevels()':'beginWords()')+'">🎮 Rejouer</button></div>');
 }else if(mode==='counting')renderCount();else renderWords();
}
const priorMapForGames=map;
map=function(){
 priorMapForGames();
 const worldList=document.querySelector('.worlds');
 if(worldList){
  worldList.insertAdjacentHTML('afterbegin','<button class="world" style="--pos:0%" onclick="showCountLevels()"><span class="symbol">🧮</span><strong>Combien d’images ?</strong><small>🌱 3 niveaux</small></button>');
  worldList.insertAdjacentHTML('beforeend','<button class="world" style="--pos:80%" onclick="beginWords()"><span class="symbol">🗣️</span><strong>Les mots en images</strong><small>👄 Je dis le mot</small></button>');
 }
};
const priorBackForGames=goBack;
goBack=function(){
 if(mode==='counting'){if(round>0){round--;renderCount()}else showCountLevels();return}
 if(mode==='countlevels'||mode==='words'){if(mode==='words'&&round>0){round--;renderWords()}else map();return}
 priorBackForGames();
};

</script></body></html>
