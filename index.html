function pickFrenchVoice(){
  if(!('speechSynthesis' in window))return null;
  const vs=window.speechSynthesis.getVoices();
  return vs.find(v=>/^fr[-_](FR|CA)/i.test(v.lang)&&/premium|enhanced|amelie|thomas|audrey|hortense/i.test(v.name))
    ||vs.find(v=>/^fr[-_]FR/i.test(v.lang))
    ||vs.find(v=>/^fr/i.test(v.lang))||null;
}
say=function(t){
  lastInstruction=String(t||'');
  if(!state.voice||!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    const utter=new SpeechSynthesisUtterance(lastInstruction);
    utter.lang='fr-FR';utter.rate=.76;utter.pitch=1.06;utter.volume=1;
    const v=pickFrenchVoice();if(v)utter.voice=v;

};

let exerciseDeck=[];
function shuffled(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildExercises(m){
 const items=[];
 const add=(kind,a,b)=>items.push({kind,a,b,key:kind+':'+a+':'+b});
 if(m==='numbers'||m==='challenge'){for(let a=1;a<=9;a++)add('numbers',a,0)}
 if(m==='tens'||m==='challenge'){for(let a=1;a<=4;a++)for(let b=0;b<=9;b++)add('tens',a,b)}
 if(m==='add'||m==='challenge'){for(let a=1;a<=9;a++)for(let b=1;b<=9;b++)if(a+b<=15)add('add',a,b)}
 if(m==='train'){const syl=['MA','LA','MI','LI','SA','RA','MO','PA','SO','LO','SI','RO','PO','RI'];for(let i=0;i<syl.length;i++)add('train',i,0)}
 if(m==='numbers'){for(let a=10;a<=12;a++)add('numbers',a,0)}
 return shuffled(items).slice(0,10);
}

 const icon=['🚀','🍎','⭐','🐸','🦋','🍓','🌸','🐱','🌞','⚽'][round%10];
 visual='<div class="big">'+Array(q.a).fill(icon).join(' ')+'</div>';

let chefLevel=0,chefRound=0,chefOrders=[],chefPlaced=[],chefStage='prep',chefDrag=null,chefTimeout=null;
function chefShuffle(a){return shuffled(a)}
function chefMakeOrders(level){
 const out=[],used=new Set(),counts=[2,3,4][level],max=[3,4,5][level];
 while(out.length<5){
  const ids=chefShuffle(chefFoods.map(f=>f.id)).slice(0,counts);
  const want={};ids.forEach(id=>want[id]=1+Math.floor(Math.random()*max));
  const key=Object.entries(want).sort().map(x=>x.join(':')).join('|');
  if(used.has(key))continue;used.add(key);out.push(want);
 }
 return out;
}

function chefBegin(l){chefLevel=l;chefRound=0;chefOrders=chefMakeOrders(l);chefNewOrder()}
function chefNewOrder(){mode='chef';chefPlaced=[];chefStage='prep';chefRender()}
function chefCurrent(){return chefOrders[chefRound]}
function chefCounts(){const c={};chefPlaced.forEach(p=>c[p.id]=(c[p.id]||0)+1);return c}
function chefTicket(){
 const want=chefCurrent();
 return Object.entries(want).map(([id,n])=>{const f=chefFoods.find(x=>x.id===id);return '<span style="display:inline-block;margin:2px 7px">'+f.icon+' × '+n+'</span>'}).join('');

function chefSvg(){

 return '<svg class="chef-pizza" viewBox="0 0 300 300" aria-label="Pizza à garnir"><defs><radialGradient id="chefCrust"><stop stop-color="#f9dc83"/><stop offset="1" stop-color="#c77a2d"/></radialGradient></defs><circle cx="150" cy="150" r="139" fill="#8b4d2c" opacity=".18"/><circle class="crust" cx="150" cy="145" r="132" fill="url(#chefCrust)"/><circle class="base" cx="150" cy="145" r="116"/><circle class="sauce" cx="150" cy="145" r="108"/><circle class="cheese" cx="150" cy="145" r="98"/><g opacity=".45" fill="#edac49"><circle cx="110" cy="95" r="13"/><circle cx="190" cy="112" r="18"/><circle cx="130" cy="190" r="16"/><circle cx="205" cy="187" r="10"/></g>'+toppings+'</svg>';
}
function chefRender(message){
 const counts=chefCounts(),want=chefCurrent();
 const foodButtons=chefFoods.map(f=>'<button class="chef-item" data-chef="'+f.id+'" onclick="chefAdd(\''+f.id+'\')"><span class="food">'+f.icon+'</span>'+f.name+'<small>'+(counts[f.id]||0)+' / '+(want[f.id]||0)+'</small></button>').join('');
 const ready=Object.entries(want).every(([id,n])=>(counts[id]||0)===n)&&Object.keys(counts).every(id=>counts[id]===(want[id]||0));
 const body='<div class="chef-wrap"><div class="chef-top"><h2>🍕 La Pizzeria</h2><strong>Commande '+(chefRound+1)+' / 5 · Niveau '+(chefLevel+1)+'</strong></div><div class="chef-kitchen"><div class="chef-order"><div class="chef-face">'+['👧🏽','👦🏻','👩🏾','👨🏻','👧🏼'][chefRound]+'</div><div class="chef-ticket">Bonjour chef ! Je voudrais :<div>'+chefTicket()+'</div></div></div><div class="chef-board" id="chef-board">'+chefSvg()+'</div></div><div class="chef-ingredients">'+foodButtons+'</div><div class="chef-feedback" id="chef-feedback">'+(message||'👆 Touche un aliment ou glisse-le sur la pizza !')+'</div><div class="chef-bottom"><button class="undo" onclick="chefUndo()">↶ Enlever</button><button onclick="chefBake()" '+(ready?'':'disabled style="opacity:.5"')+'>🔥 Au four !</button></div></div>';
 shell('👨‍🍳 À toi de cuisiner !',body);
 chefBindDrag();
}
function chefAdd(id,x,y){
 if(mode!=='chef'||chefStage!=='prep')return;
 const want=chefCurrent(),counts=chefCounts();
 if(!want[id]){chefRender('🧐 Ce client n’a pas commandé cet ingrédient !');return}
 if((counts[id]||0)>=want[id]){chefRender('👍 Tu en as déjà mis assez !');return}
 const i=chefPlaced.length;
 if(x===undefined){const angle=i*2.39996,r=35+Math.sqrt((i*41)%3500);x=150+Math.cos(angle)*r;y=145+Math.sin(angle)*r}
 const dx=x-150,dy=y-145,dist=Math.sqrt(dx*dx+dy*dy);
 if(dist>89){x=150+dx/dist*89;y=145+dy/dist*89}
 chefPlaced.push({id,x,y});
 const after=chefCounts(),complete=Object.entries(want).every(([k,n])=>after[k]===n);
 chefRender(complete?'🎉 Parfait ! Ta pizza est prête à cuire !':'✨ Super ! Continue la recette.');
}
function chefUndo(){if(chefPlaced.length){chefPlaced.pop();chefRender('↶ Ingrédient retiré.')}else chefRender()}
function chefBake(){
 const want=chefCurrent(),counts=chefCounts();
 if(!Object.entries(want).every(([k,n])=>counts[k]===n)||Object.keys(counts).some(k=>counts[k]!==want[k]))return;
 chefStage='oven';mode='chefoven';
 shell('🔥 Cuisson en cours !','<div class="chef-wrap"><div class="chef-top"><h2>👨‍🍳 Le four magique</h2></div><div class="chef-done"><div class="chef-oven">🔥🍕🔥</div><h2 style="color:#8e492b">Ça sent bon !</h2><p>La pizza cuit…</p></div></div>');

 }else chefNewOrder();

function chefBindDrag(){
 document.querySelectorAll('[data-chef]').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{
   if(e.pointerType==='mouse'&&e.button!==0)return;
   const id=btn.getAttribute('data-chef'),ghost=document.createElement('div');
   ghost.className='chef-ghost';ghost.textContent=chefFoods.find(f=>f.id===id).icon;
   ghost.style.left=(e.clientX-22)+'px';ghost.style.top=(e.clientY-22)+'px';
   document.body.appendChild(ghost);
   chefDrag={id,ghost,startX:e.clientX,startY:e.clientY,moved:false};
   const move=ev=>{if(!chefDrag)return;chefDrag.moved=chefDrag.moved||Math.hypot(ev.clientX-chefDrag.startX,ev.clientY-chefDrag.startY)>12;ghost.style.left=(ev.clientX-22)+'px';ghost.style.top=(ev.clientY-22)+'px'};
   const end=ev=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
    const drag=chefDrag;chefDrag=null;ghost.remove();
    if(!drag||!drag.moved)return;
    const board=document.getElementById('chef-board');if(!board)return;
    const rect=board.getBoundingClientRect();
    if(ev.clientX<rect.left||ev.clientX>rect.right||ev.clientY<rect.top||ev.clientY>rect.bottom)return;
    const pizza=board.querySelector('.chef-pizza'),p=pizza.getBoundingClientRect();
    const x=(ev.clientX-p.left)/p.width*300,y=(ev.clientY-p.top)/p.height*300;
    chefAdd(id,x,y);
    };
   window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
  });
 });
}

const burgerHomeBeforeAudio=burgerHome;
burgerHome=function(){
 burgerSpeechToken++;if(burgerCookTimeout)clearTimeout(burgerCookTimeout);
 burgerHomeBeforeAudio();
 const box=document.querySelector('.burger-world');
 if(box)box.insertAdjacentHTML('afterbegin',burgerAudioUI('🔊 Appuie pour écouter le client !'));
 burgerSayLater('Bonjour Jonas ! Bienvenue dans ton snack ! Appuie sur le grand bouton pour préparer un burger.');
};
burgerStart=function(){
 burgerStop();burgerStage='build';burgerStack=[];
 burgerRenderBuild('👨‍🍳 À toi de jouer !');
};
burgerRenderBuild=function(msg){
 const next=burgerRecipe[burgerStack.length];
 const prompts={bottom:'Commence par le pain du bas.',steak:'Maintenant, fais cuire le steak. Appuie sur le steak.',cheese:'Ajoute une tranche de fromage.',lettuce:'Ajoute de la salade.',tomato:'Ajoute une tomate.',top:'Termine avec le pain du haut.'};
 const prompt=prompts[next]||'Bravo !';
 shell('🍔 Construis le burger',burgerBase(burgerAudioUI('🔊 '+prompt)+'<div class="burger-stage">'+burgerSvg()+'</div><div class="burger-message">Étape '+(burgerStack.length+1)+' sur 6 · '+(msg||'Choisis le bon ingrédient.')+'</div><div class="burger-actions">'+burgerRecipe.map(id=>'<button aria-label="'+burgerNames[id]+'" onclick="burgerAdd(\''+id+'\')" '+(burgerStack.includes(id)?'disabled':'')+'><span>'+burgerIcons[id]+'</span>'+burgerNames[id]+'</button>').join('')+'</div><button class="burger-main-btn" onclick="burgerUndo()">↶ Annuler</button>'));
 burgerSayLater(msg&&msg.startsWith('🧐')? 'Essaie encore. '+prompt:prompt);
};
burgerAdd=function(id){
 if(mode!=='burger'||burgerStage!=='build')return;
 const next=burgerRecipe[burgerStack.length];
 if(id!==next){burgerSpeak('Pas celui-là ! '+({bottom:'Choisis le pain du bas.',steak:'Choisis le steak.',cheese:'Choisis le fromage.',lettuce:'Choisis la salade.',tomato:'Choisis la tomate.',top:'Choisis le pain du haut.'}[next]));return}
 if(id==='steak'){
  burgerStage='sizzle';burgerSpeak('Pschhh ! Le steak cuit !');
  const stage=document.querySelector('.burger-stage');
  if(stage)stage.insertAdjacentHTML('beforeend','<div class="burger-quick-cook" style="position:absolute;top:5px;left:0;right:0">🔥 PSSSCH ! 🔥</div>');
  burgerCookTimeout=setTimeout(()=>{if(mode!=='burger'||burgerStage!=='sizzle')return;burgerStack.push(id);burgerStage='build';burgerAfterIngredient(id)},650);
  return;
 }
 burgerStack.push(id);burgerAfterIngredient(id);
};
function burgerAfterIngredient(id){
 if(burgerStack.length===burgerRecipe.length){burgerStage='done';earn(4);burgerRenderDone()}else burgerRenderBuild('✨ Bravo ! '+burgerNames[id]+' ajouté.');
}
burgerRenderDone=function(){
 const speech='Bravo Jonas ! Le burger est prêt ! Le burger coûte neuf euros. Le client donne dix euros. Combien faut-il lui rendre ?';
 shell('🎉 Burger servi !',burgerBase(burgerAudioUI('🔊 Écoute la question sur la monnaie.')+'<div class="burger-stage">'+burgerSvg()+'</div><div class="burger-message">🎉 Burger terminé !</div><div class="burger-receipt">🍔 9 € + 💶 10 € = ❓ monnaie</div><div class="burger-actions"><button onclick="burgerAnswer(0)"><span>🪙</span>0 €</button><button onclick="burgerAnswer(1)"><span>🪙</span>1 €</button><button onclick="burgerAnswer(2)"><span>🪙</span>2 €</button></div>'));
 burgerSayLater(speech);
};
burgerAnswer=function(n){
 if(n===1){
  burgerStage='finish';
  shell('🏆 Bravo Chef !',burgerBase(burgerAudioUI('🔊 Bravo, tu as réussi !')+'<div class="burger-stage">'+burgerSvg()+'</div><div class="burger-message">🏆 Bravo Jonas ! Tu as rendu 1 €.</div><button class="burger-main-btn" onclick="burgerHome()">🍔 Rejouer</button>'));
  burgerSayLater('Bravo Jonas ! Tu as bien préparé le burger et rendu un euro de monnaie ! Tu es un super chef !');
 }else burgerSpeak('Pas tout à fait ! Dix moins neuf, ça fait combien ?');
};
const burgerBackBeforeAudio=goBack;
goBack=function(){burgerSpeechToken++;if(burgerCookTimeout)clearTimeout(burgerCookTimeout);try{if('speechSynthesis' in window)window.speechSynthesis.cancel()}catch(e){}burgerBackBeforeAudio()};


/* The customer speaks the complete order before cooking begins. */
const burgerCustomerOrder='Bonjour Chef Jonas ! Je voudrais un burger avec un steak, une tranche de fromage, de la salade et une tomate. Merci !';
function burgerReplayOrder(){burgerSpeak(burgerCustomerOrder)}
burgerHome=function(){
 burgerStop();burgerSpeechToken++;
 if(burgerCookTimeout)clearTimeout(burgerCookTimeout);
 burgerStage='order';burgerStack=[];mode='burger';
 shell('🍔 Le Snack de Jonas',burgerBase('<div class="burger-speak"><button aria-label="Écouter la commande du client" onclick="burgerReplayOrder()">🔊</button><span>👦 Le client te parle ! Écoute sa commande.</span></div><div class="burger-stage">'+burgerSvg()+'</div><div class="burger-message">👂 Écoute la commande, puis prépare le burger !</div><button class="burger-main-btn" onclick="burgerStart()">👨‍🍳 J’ai compris ! Je cuisine !</button>'));
 burgerSayLater(burgerCustomerOrder);
};
burgerStart=function(){
 burgerStop();burgerStage='build';burgerStack=[];
 burgerRenderBuild('👨‍🍳 À toi de jouer !');
};

</script></body></html>
