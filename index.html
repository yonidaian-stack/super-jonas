<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0756c9"><title>Super Jonas — La Mission CP</title><style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');
:root{font-family:'Baloo 2',system-ui,sans-serif;color:#fff;background:#126ac8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#66dcff 0,transparent 40%),linear-gradient(#0874d9,#44b6f5 60%,#0672b9);background-attachment:fixed}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ffdd27;outline-offset:3px}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}.pill{border:3px solid #c6f4ff;background:#082b80;border-radius:20px;padding:7px 17px;box-shadow:0 5px #061a55;font-weight:800}.top button{color:white}.title{text-align:center;font-size:clamp(2.2rem,6vw,4.8rem);line-height:1.05;text-shadow:0 6px #073177;margin:20px auto}.sub{text-align:center;font-size:1.25rem;font-weight:800}.hero{position:relative;min-height:480px;border:5px solid #d3f8ff;border-radius:36px;box-shadow:0 12px #073879;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(#074b9c55,#063a8a66),url('assets/hero-world.svg') center/cover}.hero:before{content:'';position:absolute;top:14%;left:4%;width:35%;height:60%;background:url('assets/super-jonas.svg') center/contain no-repeat;filter:drop-shadow(0 8px 10px #04296388);animation:bob 3s infinite}.hero h1{position:relative;text-align:center;font-size:clamp(3.5rem,10vw,7.7rem);line-height:.88;margin:30px 0 5px;color:#ffdc3a;-webkit-text-stroke:2px #fff;text-shadow:0 7px #f05b28,0 13px #08377c;transform:rotate(-3deg)}.hero p{background:#07286bdb;padding:8px 22px;border-radius:30px;font-size:1.2rem;font-weight:800}.hero .cta{margin:20px 0}.cta{border:4px solid white;border-radius:24px;background:linear-gradient(#ffed6e,#ffb300);color:#102e74;font-size:1.55rem;font-weight:800;padding:12px 36px;box-shadow:0 8px #b97106}.cta:active,.option:active{transform:translateY(4px);box-shadow:none}.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:25px 0}.world{position:relative;min-height:220px;border:4px solid #c9f5ff;border-radius:26px;box-shadow:0 8px #062a74;overflow:hidden;color:white;background:linear-gradient(0deg,#08236bed,transparent 75%),url('assets/worlds.svg') var(--pos) center/600% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:end;padding:16px}.world .symbol{font-size:3.7rem;filter:drop-shadow(0 4px 2px #05327e)}.world strong{font-size:1.28rem;text-shadow:0 3px #062660;line-height:1.1}.world small{background:#082c7d;border-radius:20px;padding:2px 15px;font-size:.95rem}.world:hover{transform:translateY(-4px)}.stage{border:5px solid #d4f6ff;border-radius:30px;background:linear-gradient(#f8fdff,#d8efff);color:#12377d;box-shadow:0 11px #07367b;padding:25px;max-width:900px;margin:20px auto;min-height:350px}.stage h2{font-size:clamp(1.7rem,4vw,2.6rem);text-align:center;margin:0 0 8px}.stage .hint{text-align:center;font-size:1.15rem;font-weight:700}.lesson{background:#fff;border:3px solid #9bd7fa;border-radius:24px;padding:20px;text-align:center;margin:20px auto;max-width:670px}.big{font-size:clamp(4rem,12vw,8rem);font-weight:800;line-height:1.15;color:#075bd0;letter-spacing:.03em}.big span{color:#ff6a35}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:20px 0}.option{background:linear-gradient(#fff,#d6ecff);border:4px solid white;outline:2px solid #7fc4f5;border-radius:20px;min-width:100px;padding:12px 20px;color:#123e92;font-weight:800;font-size:clamp(1.5rem,4vw,2.3rem);box-shadow:0 6px #77a9dc}.action{border:0;background:#0b64d2;color:white;padding:12px 20px;border-radius:18px;font-weight:800;font-size:1.08rem;box-shadow:0 5px #073b89}.secondary{background:#fff;color:#0751aa;border:3px solid #83c5ef;box-shadow:0 4px #8cb7d6}.nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}.feedback{text-align:center;min-height:35px;font-weight:800;font-size:1.35rem}.robot{font-size:3rem}.progress{height:15px;border-radius:20px;background:#c4dcf4;overflow:hidden;max-width:500px;margin:12px auto}.progress>div{height:100%;background:linear-gradient(90deg,#1fc888,#ffdb3b);transition:width .3s}.palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}.swatch{border:4px solid white;border-radius:50%;width:58px;height:58px;box-shadow:0 4px #8baed5}.swatch.selected{outline:5px solid #ffb400;transform:scale(1.1)}.art{display:block;width:min(100%,500px);max-height:390px;margin:12px auto;background:#fff;border-radius:22px;border:4px solid #a7d5f7}.art [data-part]{cursor:pointer;stroke:#173a70;stroke-width:5;transition:fill .2s}.instruction{background:#fff8d9;border:3px solid #ffcf54;border-radius:20px;padding:12px;text-align:center;font-size:1.3rem;font-weight:800}.tiny{font-size:.95rem;color:#4b6894;text-align:center}.badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.badge{background:#fff2b9;color:#8e5200;border-radius:15px;padding:6px 12px;font-weight:800}.locked{opacity:.55}@keyframes bob{50%{transform:translateY(-15px)}}@media(max-width:700px){.app{padding:10px}.worlds{grid-template-columns:repeat(2,1fr);gap:12px}.world{min-height:170px}.world .symbol{font-size:2.6rem}.world strong{font-size:1rem}.hero{min-height:490px}.hero:before{top:2%;left:27%;width:46%;height:40%}.hero h1{margin-top:170px}.stage{padding:15px}.swatch{width:47px;height:47px}.top{justify-content:center}}
</style></head><body><main class="app"><header class="top"><span class="pill" id="stars">⭐ 0 étoile</span><span class="pill">🦸 SUPER JONAS · Niv. <span id="level">1</span></span><button class="pill" id="voice" onclick="toggleVoice()">🔊 Voix ON</button></header><div id="view"></div><footer class="tiny" style="color:white;margin:30px 0">💙 Super Jonas · Apprendre en s'amusant · Progression enregistrée sur cet appareil</footer></main><script>
const worlds=[['🔢','Royaume des nombres','numbers'],['🧊','Planète des dizaines','tens'],['➕','Cité des additions','add'],['🎨','Atelier des couleurs','color'],['🔤','Académie de lecture','read'],['📚','Histoires magiques','story'],['🚂','Train des syllabes','train'],['🏆','Tour des défis','challenge']];
const saved=JSON.parse(localStorage.getItem('superjonas-v3')||'{}');let state={stars:saved.stars||0,lesson:saved.lesson||0,done:saved.done||{},voice:saved.voice!==false};let mode='',round=0,current=null,colorStep=0,colorSelected='',readStep=0,feedback='',answered=false;
const lessons=[{a:'M',b:'A',sy:'MA',word:'MAMA',prompt:'Le M fait mmmm. Le A fait aaaa. Ensemble : MA !'},{a:'L',b:'A',sy:'LA',word:'LALA',prompt:'Le L fait llll. Le A fait aaaa. Ensemble : LA !'},{a:'M',b:'I',sy:'MI',word:'MIMI',prompt:'Le M fait mmmm. Le I fait iiii. Ensemble : MI !'},{a:'L',b:'I',sy:'LI',word:'LILI',prompt:'Le L fait llll. Le I fait iiii. Ensemble : LI !'},{a:'S',b:'A',sy:'SA',word:'SALI',prompt:'Le S fait ssss. Le A fait aaaa. Ensemble : SA !'},{a:'R',b:'A',sy:'RA',word:'RARA',prompt:'Le R fait rrrr. Le A fait aaaa. Ensemble : RA !'},{a:'M',b:'O',sy:'MO',word:'MOTO',prompt:'Le M fait mmmm. Le O fait oooo. Ensemble : MO !'},{a:'P',b:'A',sy:'PA',word:'PAPA',prompt:'Le P fait p. Le A fait aaaa. Ensemble : PA !'}];
const colors=[['rouge','#f43b45'],['bleu','#287bfa'],['jaune','#ffda32'],['vert','#37bd66'],['orange','#ff9232'],['violet','#9853d9']];
const drawings=[{name:'la fusée',parts:[['corps','rouge'],['fenêtre','bleu'],['flamme','orange'],['aile gauche','jaune'],['aile droite','jaune']]},{name:'la maison',parts:[['toit','rouge'],['mur','jaune'],['porte','bleu'],['soleil','orange'],['arbre','vert']]}];
function save(){localStorage.setItem('superjonas-v3',JSON.stringify(state));document.getElementById('stars').textContent='⭐ '+state.stars+' étoiles';document.getElementById('level').textContent=1+Math.floor(state.stars/20);document.getElementById('voice').textContent=state.voice?'🔊 Voix ON':'🔇 Voix OFF'}
function say(t){if(!state.voice||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.pitch=1.1;window.speechSynthesis.speak(u)}
function toggleVoice(){state.voice=!state.voice;save();if(state.voice)say('Salut Jonas ! Prêt pour une aventure ?')}
function el(s){document.getElementById('view').innerHTML=s}
function nav(){return '<div class="nav"><button class="action secondary" onclick="home()">🏠 Accueil</button><button class="action secondary" onclick="map()">🗺️ Les mondes</button></div>'}
function home(){mode='home';el('<section class="hero"><h1>SUPER<br>JONAS</h1><p>⚡ LA MISSION CP ⚡</p><p>Deviens le héros des lettres et des nombres !</p><button class="cta" onclick="map()">🚀 C’EST PARTI !</button></section><p class="sub">🎨 Colorie · 📖 Apprends à lire · ⭐ Gagne des étoiles</p>');}
function map(){mode='map';el('<h1 class="title">🌍 LES MONDES DE JONAS</h1><p class="sub">Choisis ton aventure, super-héros !</p><section class="worlds">'+worlds.map((w,i)=>'<button class="world" style="--pos:'+((i%6)*20)+'%" onclick="start(\''+w[2]+'\')"><span class="symbol">'+w[0]+'</span><strong>'+w[1]+'</strong><small>⭐ Jouer</small></button>').join('')+'</section>'+nav());}
function shell(title,body){el('<section class="stage"><h2>'+title+'</h2>'+body+'</section>'+nav())}
function earn(n=1){state.stars+=n;state.done[mode]=(state.done[mode]||0)+1;save()}
function start(m){mode=m;round=0;feedback='';answered=false;if(m==='color'){colorStep=0;colorSelected='';renderColor()}else if(m==='read'){readStep=0;renderRead()}else if(m==='story'){renderStory()}else{question()}}
function rand(n){return Math.floor(Math.random()*n)}
function mix(a){return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function options(vals,correct){return '<div class="choices">'+mix([...new Set(vals)]).map(x=>'<button class="option" onclick="answer(\''+String(x).replace(/'/g,"\\'")+'\')">'+x+'</button>').join('')+'</div>'}
function question(){answered=false;feedback='';let title='',prompt='',visual='',answer='',opts=[];let a=1+rand(7),b=1+rand(5);if(mode==='numbers'||mode==='challenge'&&round%3===0){title='🔢 Le royaume des nombres';answer=a;visual='<div class="big">'+Array.from({length:a},()=>['🚀','🍎','⭐','🐸'][round%4]).join(' ')+'</div>';prompt='Compte les objets. Combien y en a-t-il ?';opts=[a,Math.max(1,a-1),a+1]}else if(mode==='tens'||mode==='challenge'&&round%3===1){title='🧊 La planète des dizaines';a=1+rand(4);b=rand(10);answer=a*10+b;visual='<div class="big">'+a+' 🟦<span> dizaines</span><br>'+b+' 🔹<span> unités</span></div>';prompt='Combien font '+a+' dizaines et '+b+' unités ?';opts=[answer,answer+10,answer+1]}else if(mode==='add'||mode==='challenge'){title='➕ La cité des additions';answer=a+b;visual='<div class="big">'+a+' <span>+</span> '+b+' = ?</div>';prompt='Compte et trouve le résultat !';opts=[answer,answer+1,Math.max(1,answer-1)]}else if(mode==='train'){title='🚂 Le train des syllabes';let l=lessons[Math.min(state.lesson,lessons.length-1)];answer=l.sy;visual='<div class="big">🚂 '+l.a+' + '+l.b+' = ?</div>';prompt='Écoute les deux sons. Quelle syllabe forment-ils ?';opts=[l.sy,l.a+'O','LI']}else{title='Mission';answer=1;opts=[1,2,3]}current={answer:String(answer),prompt};shell(title,'<p class="hint">Mission '+(round+1)+' / 5</p><div class="progress"><div style="width:'+(round*20)+'%"></div></div><div class="lesson">'+visual+'</div><p class="instruction">🤖 '+prompt+'</p><div id="answers">'+options(opts,answer)+'</div><div class="feedback" id="feedback"></div><div class="nav"><button class="action" onclick="say(current.prompt)">🔊 Réécouter</button></div>');setTimeout(()=>say(prompt),150)}
function answer(v){if(answered)return;let f=document.getElementById('feedback');if(v===current.answer){answered=true;earn();f.textContent='🌟 Bravo Super Jonas !';say('Bravo Jonas ! Tu as réussi !');document.getElementById('answers').innerHTML='<div class="nav"><button class="cta" onclick="nextQuestion()">➡️ Continuer</button></div>'}else{f.textContent='💙 Essaie encore, tu vas y arriver !';say('Presque ! Réessaie tranquillement.')}}
function nextQuestion(){round++;if(round>=5){shell('🏆 Mission accomplie !','<div class="lesson"><div class="big">⭐⭐⭐⭐⭐</div><p class="hint">Tu as terminé les cinq défis !</p></div><div class="nav"><button class="cta" onclick="start(mode)">🔁 Rejouer</button></div>')}else question()}
function lesson(){return lessons[Math.min(state.lesson,lessons.length-1)]}
function renderRead(){let l=lesson(),steps=[{title:'Découvre les sons',big:'<span>'+l.a+'</span> · '+l.b,txt:'Écoute les sons, puis répète avec le robot.',voice:'Le '+l.a+' fait '+l.a.toLowerCase()+' et le '+l.b+' fait '+l.b.toLowerCase()+'. '+l.prompt},{title:'La magie des lettres',big:l.a+' <span>+</span> '+l.b+' <span>=</span> '+l.sy,txt:'Regarde : les deux sons se collent pour former une syllabe.',voice:l.prompt},{title:'À toi de lire !',big:l.sy,txt:'Essaie de lire cette syllabe tout seul, puis écoute.',voice:'Essaie de lire. '+l.sy+'. Bravo !'}],s=steps[readStep];shell('📖 Académie de lecture','<p class="hint">Leçon '+(state.lesson+1)+' / '+lessons.length+' · '+s.title+'</p><div class="progress"><div style="width:'+((readStep+1)*33)+'%"></div></div><div class="lesson"><div class="robot">🤖</div><div class="big">'+s.big+'</div><p class="hint">'+s.txt+'</p></div><div class="nav"><button class="action" onclick="say('+JSON.stringify(s.voice).replace(/"/g,'&quot;')+')">🔊 Écouter le robot</button><button class="cta" onclick="nextRead()">'+(readStep===2?'🎯 Je m’entraîne':'➡️ Suivant')+'</button></div>');setTimeout(()=>say(s.voice),200)}
function nextRead(){if(readStep<2){readStep++;renderRead()}else readQuiz()}
function readQuiz(){let l=lesson();current={answer:l.sy,prompt:'Écoute et trouve la syllabe '+l.sy};answered=false;shell('🎯 Le défi du super-lecteur','<p class="instruction">🤖 Écoute la syllabe, puis touche la bonne réponse.</p><div class="nav"><button class="action" onclick="say(current.prompt)">🔊 Écouter la syllabe</button></div><div id="answers">'+options([l.sy,l.a+'O',l.a+'I',l.b+'M'],l.sy)+'</div><div class="feedback" id="feedback"></div>');setTimeout(()=>say(current.prompt),250)}
const oldAnswer=answer;answer=function(v){if(mode==='read'){if(answered)return;let f=document.getElementById('feedback');if(v===current.answer){answered=true;earn(3);f.textContent='🌟 Incroyable ! Tu sais lire '+v+' !';say('Bravo Jonas ! Tu sais lire '+v+' !');document.getElementById('answers').innerHTML='<div class="nav"><button class="cta" onclick="advanceRead()">⭐ Leçon suivante</button><button class="action secondary" onclick="renderRead()">🔁 Revoir la leçon</button></div>'}else{f.textContent='Écoute encore les sons, tu peux y arriver !';say('Écoute encore, puis réessaie !')}}else oldAnswer(v)}
function advanceRead(){if(state.lesson<lessons.length-1)state.lesson++;save();readStep=0;renderRead()}
function artSvg(){let d=drawings[Math.floor(colorStep/5)%2],shape=d.name==='la fusée'?'<path data-part="corps" d="M190 250 L190 120 Q250 20 310 120 L310 250 Z"/><circle data-part="fenêtre" cx="250" cy="153" r="33"/><path data-part="aile gauche" d="M190 210 L130 280 L190 280 Z"/><path data-part="aile droite" d="M310 210 L370 280 L310 280 Z"/><path data-part="flamme" d="M215 255 Q225 340 250 360 Q275 340 285 255 Z"/>':'<rect data-part="mur" x="140" y="155" width="220" height="190"/><path data-part="toit" d="M105 160 L250 55 L395 160 Z"/><rect data-part="porte" x="225" y="245" width="55" height="100"/><circle data-part="soleil" cx="425" cy="65" r="38"/><path data-part="arbre" d="M70 345 L70 270 Q10 265 45 210 Q70 150 105 210 Q145 265 90 270 L90 345 Z"/>';return '<svg class="art" viewBox="0 0 500 390" role="img" aria-label="Dessin à colorier : '+d.name+'"><rect width="500" height="390" fill="#e6f8ff"/><path d="M0 350 Q250 325 500 350 L500 390 L0 390" fill="#b4e8b4"/>'+shape.replace(/data-part="([^"]+)"/g,(all,p)=>'data-part="'+p+'" fill="'+(colored[p]||'#fff')+'" onclick="paint(\''+p+'\')"')+'</svg>'}
let colored={};
function renderColor(){let d=drawings[Math.floor(colorStep/5)%2],idx=colorStep%5,part=d.parts[idx];if(idx===0)colored={};colorSelected='';shell('🎨 L’Atelier des couleurs','<p class="hint">Dessin '+(Math.floor(colorStep/5)+1)+' · '+d.name+'</p><p class="instruction">🤖 Colorie '+part[0]+' en <strong>'+part[1].toUpperCase()+'</strong> !</p><div class="palette">'+colors.map(c=>'<button class="swatch" aria-label="'+c[0]+'" title="'+c[0]+'" style="background:'+c[1]+'" onclick="chooseColor(\''+c[0]+'\')"></button>').join('')+'</div><div id="drawing">'+artSvg()+'</div><div class="feedback" id="feedback"></div><div class="nav"><button class="action" onclick="say(\'Colorie '+part[0]+' en '+part[1]+'\')">🔊 Réécouter</button></div>');setTimeout(()=>say('Colorie '+part[0]+' en '+part[1]+'. Choisis la couleur, puis touche la bonne partie du dessin.'),180)}
function chooseColor(c){colorSelected=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x.title===c));say(c)}
function paint(part){let d=drawings[Math.floor(colorStep/5)%2],target=d.parts[colorStep%5];if(!colorSelected){say('Choisis une couleur d’abord !');return}if(part!==target[0]||colorSelected!==target[1]){document.getElementById('feedback').textContent='💙 Essaie encore : '+target[1]+' pour '+target[0];say('Presque ! Cherche '+target[0]+' et utilise le '+target[1]);return}colored[part]=colors.find(c=>c[0]===colorSelected)[1];document.getElementById('drawing').innerHTML=artSvg();earn();document.getElementById('feedback').innerHTML='🌟 Bravo ! <button class="action" onclick="nextColor()">➡️ Continuer</button>';say('Super Jonas ! C’est la bonne couleur !')}
function nextColor(){colorStep++;if(colorStep>=10){shell('🏆 Artiste de génie !','<div class="lesson"><div class="big">🎨 ⭐</div><p>Tu as terminé tes deux dessins !</p></div><div class="nav"><button class="cta" onclick="start(\'color\')">🎨 Recommencer</button></div>')}else renderColor()}
function renderStory(){let l=lesson();let txt=state.lesson>=3?'MIMI A LU. LILI A LU.':'MIMI. LILI. MAMA.';shell('📚 Les histoires magiques','<p class="hint">Une petite histoire à écouter et à lire avec le robot</p><div class="lesson"><div class="big" style="font-size:clamp(2.6rem,7vw,5rem)">📖</div><div class="big" style="font-size:clamp(2rem,6vw,4rem)">'+txt+'</div><p>Écoute, puis essaie de lire les syllabes que tu connais.</p></div><div class="nav"><button class="action" onclick="say(\''+txt+'\')">🔊 Écouter l’histoire</button><button class="cta" onclick="start(\'read\')">📖 Apprendre à lire</button></div>');setTimeout(()=>say('Voici une petite histoire. '+txt),250)}
save();home();
</script></body></html>
